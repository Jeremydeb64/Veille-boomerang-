name: Veille RSS

on:
  schedule:
    - cron: "45 * * * *"    # toutes les heures (gratuit sur un dépôt public)
  workflow_dispatch: {}    # bouton « Run workflow » pour lancer à la main
  push:                    # relance aussi quand on modifie le script ou les sources
    branches: [main]
    paths: ["fetch.py", "sources.yml", ".github/workflows/veille.yml", ".refresh"]   # .refresh = bouton « Rafraîchir maintenant »

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python fetch.py
      - name: Enregistrer les articles du jour
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Veille du $(date -u +%F)"
          git push
