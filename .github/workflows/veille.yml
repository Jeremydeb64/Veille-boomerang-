name: Veille RSS

on:
  schedule:
    # Passages avant chaque édition (heures UTC). GitHub peut retarder un horaire planifié.
    - cron: "20 6 * * *"    # 07:20 heure suisse (hiver), avant l'édition de 8h
    - cron: "40 6 * * *"    # second passage de secours
    - cron: "50 10 * * *"   # 11:50, avant l'édition de 12h30
    - cron: "20 19 * * *"   # 20:20, avant l'édition de 21h
  workflow_dispatch: {}    # bouton « Run workflow » pour lancer à la main
  push:                    # relance aussi quand on modifie le script ou les sources
    branches: [main]
    paths: ["fetch.py", "sources.yml", ".github/workflows/veille.yml", ".refresh"]   # .refresh = bouton « Rafraîchir maintenant »

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python fetch.py
      - name: Enregistrer les articles du jour
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Veille du $(date -u +%F)"
          git push
